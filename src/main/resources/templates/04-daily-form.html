<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohasaba · Daily Reflection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Dancing+Script:wght@600&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* =============================================================
       MOHASABA — UNIFIED STYLESHEET
       Single source of truth for every screen in the app.
       Visual language (palette, type, radii, shadows) is inherited
       from the login screen: near-black stage, off-white type, one
       neon-blue accent, plus a muted teal-green reserved only for
       "done / success" states.

       Structure of this file:
         1. Design tokens (:root)
         2. Global reset + base typography
         3. Shared components used by 2+ pages (buttons, inputs,
            bottom nav, toast, section headers …)
         4. Page-specific sections, each scoped under a unique
            body class (body.page-xxx) so identical class names on
            different pages never leak into one another.
       ============================================================= */

    /* ------------------------------------------------------------- */
    /* 1. DESIGN TOKENS                                               */
    /* ------------------------------------------------------------- */
    :root{
      --bg:        #07080b;
      --panel:     #101219;
      --panel-2:   #161924;
      --panel-3:   #1b1f2c;
      --border:    rgba(255,255,255,.09);
      --border-2:  rgba(255,255,255,.14);
      --text:      #f3f4f7;
      --text-dim:  #8c90a0;
      --text-dim-2:#5e6272;

      --neon:      #2fd8ff;
      --neon-2:    #5b7dff;
      --neon-soft: rgba(47,216,255,.35);
      --neon-glow: rgba(47,216,255,.18);

      /* secondary accent — used ONLY for "completed / success" states */
      --success:      #34e0b0;
      --success-soft: rgba(52,224,176,.35);
      --success-glow: rgba(52,224,176,.14);

      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;

      --font-ui:    'Inter', system-ui, sans-serif;
      --font-head:  'Poppins', var(--font-ui);
      --font-ar:    'Reem Kufi', var(--font-head);
      --font-script:'Dancing Script', cursive;
    }

    /* ------------------------------------------------------------- */
    /* 2. GLOBAL RESET + BASE TYPOGRAPHY                              */
    /* ------------------------------------------------------------- */
    *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
    html, body{ height:100%; }
    body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--font-ui);
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
    }

    /* ------------------------------------------------------------- */
    /* 3. SHARED COMPONENTS                                           */
    /* ------------------------------------------------------------- */

    /* ---- form fields (login, daily reflection, …) ---- */
    input[type=text],
    input[type=email],
    input[type=date],
    input[type=password],
    textarea{
      width:100%;
      background:var(--bg);
      border:1px solid var(--border);
      color:var(--text);
      font-family:var(--font-ui);
      font-size:14px;
      padding:12px 14px;
      border-radius:var(--radius-sm);
      outline:none;
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    textarea{ resize:vertical; min-height:90px; line-height:1.6; }
    input::placeholder, textarea::placeholder{ color:var(--text-dim-2); }
    input:focus, textarea:focus{
      border-color:var(--neon-soft);
      box-shadow:0 0 0 3px var(--neon-glow);
    }

    /* ---- primary / ghost buttons (used app‑wide) ---- */
    .btn-primary{
      display:block;
      width:100%;
      background:linear-gradient(135deg, var(--neon), var(--neon-2));
      color:#06070a;
      border:none;
      border-radius:var(--radius-sm);
      padding:13px 20px;
      font-family:var(--font-head);
      font-weight:600;
      font-size:14.5px;
      letter-spacing:.01em;
      cursor:pointer;
      text-align:center;
      text-decoration:none;
      box-shadow:0 10px 24px -8px var(--neon-soft);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -8px var(--neon-soft); }
    .btn-primary:active{ transform:scale(.98); }

    .btn-ghost{
      display:block;
      width:100%;
      background:transparent;
      color:var(--text-dim);
      border:1px solid var(--border-2);
      border-radius:var(--radius-sm);
      padding:12px 20px;
      font-family:var(--font-ui);
      font-size:13px;
      font-weight:500;
      cursor:pointer;
      text-align:center;
      transition:all .15s;
    }
    .btn-ghost:hover{ color:var(--text); border-color:var(--border-2); background:rgba(255,255,255,.03); }

    /* success‑tinted variant of the ghost button (e.g. "send report") */
    .btn-ghost.success{ color:var(--success); border-color:var(--success); }
    .btn-ghost.success:hover{ background:var(--success-glow); }

    /* ---- section headers (reports / week / home) ---- */
    .section{ padding:0 20px; margin-bottom:20px; }
    .section-head{
      font-size:10px;
      font-weight:600;
      color:var(--text-dim-2);
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    /* ---- bottom tab navigation (home / week / reports / daily) ---- */
    .bottom-nav{
      position:fixed; bottom:0; left:0; right:0;
      background:var(--panel-2);
      border-top:1px solid var(--border);
      display:flex; justify-content:space-around;
      padding:8px 0 14px;
      z-index:100;
    }
    .nav-item{
      display:flex; flex-direction:column; align-items:center;
      gap:2px;
      font-size:9px; font-weight:500;
      color:var(--text-dim-2);
      text-decoration:none;
      cursor:pointer;
      background:none; border:none;
      font-family:var(--font-ui);
      padding:4px 14px;
      transition:color .15s;
    }
    .nav-item.active{ color:var(--neon); }
    .nav-item .nav-icon{ font-size:20px; }

    /* ---- toast (base — page sections set the bottom offset) ---- */
    .toast{
      display:none;
      position:fixed; left:50%;
      transform:translateX(-50%);
      padding:10px 24px;
      border-radius:20px;
      font-size:13px;
      font-weight:600;
      white-space:nowrap;
      z-index:999;
      font-family:var(--font-ui);
      box-shadow:0 4px 20px rgba(0,0,0,.35);
    }
    .toast.neon{ background:var(--neon); color:#06070a; box-shadow:0 4px 20px rgba(0,0,0,.3), 0 0 20px var(--neon-soft); }
    .toast.success{ background:var(--success); color:#06070a; box-shadow:0 4px 20px rgba(0,0,0,.3), 0 0 20px var(--success-soft); }

    /* ---- lightweight modal (used by reports for past‑entry preview) ---- */
    .modal-overlay{
      position:fixed; inset:0;
      background:rgba(7,8,11,.92);
      display:flex; align-items:center; justify-content:center;
      z-index:9000; padding:20px; overflow-y:auto;
    }
    .modal-card{
      background:var(--panel-2);
      border-radius:var(--radius-lg);
      padding:24px;
      max-width:400px; width:100%;
      border:1px solid var(--neon-soft);
    }
    .modal-head{
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:16px;
    }
    .modal-title{ font-size:14px; color:var(--neon); font-weight:500; }
    .modal-close{
      background:none; border:none;
      color:var(--text-dim); font-size:20px;
      cursor:pointer; line-height:1;
    }
    .modal-close:hover{ color:var(--text); }

    /* -----------------------------------------------------------
       PAGE-SPECIFIC: daily form
       ----------------------------------------------------------- */
    body.page-daily{ padding-bottom:110px; }

    body.page-daily .header{
      background:var(--panel-2); border-bottom:1px solid var(--border);
      padding:14px 20px 12px; position:sticky; top:0; z-index:50;
    }
    body.page-daily .header-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    body.page-daily .back-btn{ background:none; border:none; color:var(--neon); font-size:18px; cursor:pointer; padding:2px 6px 2px 0; text-decoration:none; }
    body.page-daily .header-title{ font-family:var(--font-head); font-size:18px; font-weight:600; color:var(--text); }
    body.page-daily .header-qnum{ font-size:12px; color:var(--neon); font-weight:500; }

    body.page-daily .progress-track{ height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
    body.page-daily .progress-fill{ height:3px; border-radius:2px; background:var(--neon); transition:width .35s cubic-bezier(.22,1,.36,1); }

    body.page-daily .q-area{ padding:24px 20px 0; max-width:520px; margin:0 auto; }
    body.page-daily .q-card{
      background:var(--panel); border-radius:18px; padding:24px 20px;
      border:1px solid var(--border); min-height:220px; margin-bottom:16px;
    }
    body.page-daily .q-cat{ font-size:10px; font-weight:600; color:var(--success); letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; }
    body.page-daily .q-cat.sunday{ color:var(--neon); }
    body.page-daily .q-text{ font-family:var(--font-head); font-size:20px; font-weight:500; color:var(--text); line-height:1.5; margin-bottom:20px; }

    body.page-daily .star-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    body.page-daily .star{ font-size:28px; cursor:pointer; color:var(--border-2); transition:color .12s, transform .1s; line-height:1; user-select:none; }
    body.page-daily .star.filled{ color:var(--neon); }
    body.page-daily .star:hover{ transform:scale(1.15); }
    body.page-daily .star-val{ font-size:12px; color:var(--neon); margin-left:6px; }

    body.page-daily .choice-row{ display:flex; flex-wrap:wrap; gap:8px; }
    body.page-daily .choice-btn{
      padding:8px 16px; border-radius:20px; border:1px solid var(--border-2);
      background:transparent; color:var(--text);
      font-family:var(--font-ui); font-size:13px; cursor:pointer; transition:all .15s;
    }
    body.page-daily .choice-btn.selected{ background:var(--neon-glow); border-color:var(--neon); color:var(--neon); }

    body.page-daily .nav-fixed{
      position:fixed; bottom:0; left:0; right:0; background:var(--panel-2);
      border-top:1px solid var(--border); padding:12px 20px 24px; z-index:100;
    }
    body.page-daily .nav-btns{ display:flex; gap:10px; max-width:520px; margin:0 auto 12px; }
    body.page-daily .btn-back{
      flex:1; background:transparent; color:var(--text-dim);
      border:1px solid var(--border-2); border-radius:11px; padding:13px 0;
      font-family:var(--font-ui); font-size:14px; font-weight:500; cursor:pointer; transition:all .15s;
    }
    body.page-daily .btn-back:hover:not(:disabled){ border-color:var(--text-dim); color:var(--text); }
    body.page-daily .btn-back:disabled{ opacity:.35; cursor:not-allowed; }

    body.page-daily .btn-next{
      flex:2; background:var(--neon); color:var(--bg);
      border:none; border-radius:11px; padding:13px 0;
      font-family:var(--font-head); font-size:14px; font-weight:600; cursor:pointer;
      transition:opacity .15s, transform .1s;
    }
    body.page-daily .btn-next:hover{ opacity:.9; }
    body.page-daily .btn-next:active{ transform:scale(.98); }
    body.page-daily .btn-next.submit{ background:var(--success); }

    body.page-daily .dot-nav{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:520px; margin:0 auto; }
    body.page-daily .dot{
      width:22px; height:22px; border-radius:5px; border:none;
      font-size:8px; font-weight:500; cursor:pointer; transition:all .13s;
      background:var(--border); color:var(--text-dim-2);
      font-family:var(--font-ui); line-height:22px; text-align:center;
    }
    body.page-daily .dot.answered{ background:var(--success-glow); color:var(--success); }
    body.page-daily .dot.current{ background:var(--neon); color:var(--bg); }

    body.page-daily .toast{ bottom:130px; }
  </style>
</head>
<body class="page-daily" data-page="daily">

<!-- HEADER -->
<div class="header">
  <div class="header-row">
    <a href="03-home.html" class="back-btn">←</a>
    <div class="header-title">Today's reflection</div>
    <div class="header-qnum" id="q-num">Q 1 of 40</div>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill" style="width:2.5%"></div>
  </div>
</div>

<!-- QUESTION AREA -->
<div class="q-area">
  <div class="q-card" id="q-card">
    <div class="q-cat" id="q-cat">Gratitude</div>
    <div class="q-text" id="q-text">Loading…</div>
    <div id="q-input"></div>
  </div>
</div>

<!-- FIXED NAV -->
<div class="nav-fixed">
  <div class="nav-btns">
    <button class="btn-back" id="btn-back" onclick="navigate(-1)" disabled>← Back</button>
    <button class="btn-next" id="btn-next" onclick="navigate(1)">Next →</button>
  </div>
  <div class="dot-nav" id="dot-nav"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/javaScript/app.js"></script>
</body>
</html>
