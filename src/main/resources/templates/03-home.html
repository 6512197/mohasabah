<!-- TOP BAR -->
<div class="topbar">
  <div>
    <div class="topbar-date" id="today-date"></div>
    <div class="topbar-greeting" id="greeting-line">
      Good morning, <em id="user-name">Ahmad</em>
    </div>
  </div>
  <button class="logout-btn" onclick="logout()">Sign out</button>
</div>

<div class="section">

  <!-- Sunday unlocked banner -->
  <div class="sunday-banner" id="sunday-banner">
    <div class="icon">📖</div>
    <p>Sunday deep-dive unlocked</p>
    <small>Question 41 is available today — reflect on your whole week.</small>
  </div>

  <!-- Today's progress -->
  <div class="progress-card">
    <div class="progress-row">
      <span class="progress-label">Today's progress</span>
      <span class="progress-pct" id="prog-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="prog-fill" style="width:0%"></div>
    </div>
    <div class="progress-sub">
      <span id="prog-sub">0 of 40 questions answered</span>
      <span class="completed-badge" id="completed-badge" style="display:none">✓ Submitted</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">This week</div>
      <div class="stat-number" style="color: var(--success);" id="week-count">0<span>/7</span></div>
      <div class="stat-sub">days complete</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total entries</div>
      <div class="stat-number" style="color: var(--neon);" id="total-count">0</div>
      <div class="stat-sub">days journaled</div>
    </div>
  </div>

  <!-- CTA button -->
  <a href="04-daily-form.html" class="btn-primary" id="cta-btn">Start today's reflection →</a>
