<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohasaba · This Week</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Dancing+Script:wght@600&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* =============================================================
       MOHASABA — UNIFIED STYLESHEET
       Single source of truth for every screen in the app.
       Visual language (palette, type, radii, shadows) is inherited
       from the login screen: near-black stage, off-white type, one
       neon-blue accent, plus a muted teal-green reserved only for
       "done / success" states.

       Structure of this file:
         1. Design tokens (:root)
         2. Global reset + base typography
         3. Shared components used by 2+ pages (buttons, inputs,
            bottom nav, toast, section headers …)
         4. Page-specific sections, each scoped under a unique
            body class (body.page-xxx) so identical class names on
            different pages never leak into one another.
       ============================================================= */

    /* ------------------------------------------------------------- */
    /* 1. DESIGN TOKENS                                               */
    /* ------------------------------------------------------------- */
    :root{
      --bg:        #07080b;
      --panel:     #101219;
      --panel-2:   #161924;
      --panel-3:   #1b1f2c;
      --border:    rgba(255,255,255,.09);
      --border-2:  rgba(255,255,255,.14);
      --text:      #f3f4f7;
      --text-dim:  #8c90a0;
      --text-dim-2:#5e6272;

      --neon:      #2fd8ff;
      --neon-2:    #5b7dff;
      --neon-soft: rgba(47,216,255,.35);
      --neon-glow: rgba(47,216,255,.18);

      /* secondary accent — used ONLY for "completed / success" states */
      --success:      #34e0b0;
      --success-soft: rgba(52,224,176,.35);
      --success-glow: rgba(52,224,176,.14);

      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;

      --font-ui:    'Inter', system-ui, sans-serif;
      --font-head:  'Poppins', var(--font-ui);
      --font-ar:    'Reem Kufi', var(--font-head);
      --font-script:'Dancing Script', cursive;
    }

    /* ------------------------------------------------------------- */
    /* 2. GLOBAL RESET + BASE TYPOGRAPHY                              */
    /* ------------------------------------------------------------- */
    *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
    html, body{ height:100%; }
    body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--font-ui);
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
    }

    /* ------------------------------------------------------------- */
    /* 3. SHARED COMPONENTS                                           */
    /* ------------------------------------------------------------- */

    /* ---- form fields (login, daily reflection, …) ---- */
    input[type=text],
    input[type=email],
    input[type=date],
    input[type=password],
    textarea{
      width:100%;
      background:var(--bg);
      border:1px solid var(--border);
      color:var(--text);
      font-family:var(--font-ui);
      font-size:14px;
      padding:12px 14px;
      border-radius:var(--radius-sm);
      outline:none;
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    textarea{ resize:vertical; min-height:90px; line-height:1.6; }
    input::placeholder, textarea::placeholder{ color:var(--text-dim-2); }
    input:focus, textarea:focus{
      border-color:var(--neon-soft);
      box-shadow:0 0 0 3px var(--neon-glow);
    }

    /* ---- primary / ghost buttons (used app‑wide) ---- */
    .btn-primary{
      display:block;
      width:100%;
      background:linear-gradient(135deg, var(--neon), var(--neon-2));
      color:#06070a;
      border:none;
      border-radius:var(--radius-sm);
      padding:13px 20px;
      font-family:var(--font-head);
      font-weight:600;
      font-size:14.5px;
      letter-spacing:.01em;
      cursor:pointer;
      text-align:center;
      text-decoration:none;
      box-shadow:0 10px 24px -8px var(--neon-soft);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -8px var(--neon-soft); }
    .btn-primary:active{ transform:scale(.98); }

    .btn-ghost{
      display:block;
      width:100%;
      background:transparent;
      color:var(--text-dim);
      border:1px solid var(--border-2);
      border-radius:var(--radius-sm);
      padding:12px 20px;
      font-family:var(--font-ui);
      font-size:13px;
      font-weight:500;
      cursor:pointer;
      text-align:center;
      transition:all .15s;
    }
    .btn-ghost:hover{ color:var(--text); border-color:var(--border-2); background:rgba(255,255,255,.03); }

    /* success‑tinted variant of the ghost button (e.g. "send report") */
    .btn-ghost.success{ color:var(--success); border-color:var(--success); }
    .btn-ghost.success:hover{ background:var(--success-glow); }

    /* ---- section headers (reports / week / home) ---- */
    .section{ padding:0 20px; margin-bottom:20px; }
    .section-head{
      font-size:10px;
      font-weight:600;
      color:var(--text-dim-2);
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    /* ---- bottom tab navigation (home / week / reports / daily) ---- */
    .bottom-nav{
      position:fixed; bottom:0; left:0; right:0;
      background:var(--panel-2);
      border-top:1px solid var(--border);
      display:flex; justify-content:space-around;
      padding:8px 0 14px;
      z-index:100;
    }
    .nav-item{
      display:flex; flex-direction:column; align-items:center;
      gap:2px;
      font-size:9px; font-weight:500;
      color:var(--text-dim-2);
      text-decoration:none;
      cursor:pointer;
      background:none; border:none;
      font-family:var(--font-ui);
      padding:4px 14px;
      transition:color .15s;
    }
    .nav-item.active{ color:var(--neon); }
    .nav-item .nav-icon{ font-size:20px; }

    /* ---- toast (base — page sections set the bottom offset) ---- */
    .toast{
      display:none;
      position:fixed; left:50%;
      transform:translateX(-50%);
      padding:10px 24px;
      border-radius:20px;
      font-size:13px;
      font-weight:600;
      white-space:nowrap;
      z-index:999;
      font-family:var(--font-ui);
      box-shadow:0 4px 20px rgba(0,0,0,.35);
    }
    .toast.neon{ background:var(--neon); color:#06070a; box-shadow:0 4px 20px rgba(0,0,0,.3), 0 0 20px var(--neon-soft); }
    .toast.success{ background:var(--success); color:#06070a; box-shadow:0 4px 20px rgba(0,0,0,.3), 0 0 20px var(--success-soft); }

    /* ---- lightweight modal (used by reports for past‑entry preview) ---- */
    .modal-overlay{
      position:fixed; inset:0;
      background:rgba(7,8,11,.92);
      display:flex; align-items:center; justify-content:center;
      z-index:9000; padding:20px; overflow-y:auto;
    }
    .modal-card{
      background:var(--panel-2);
      border-radius:var(--radius-lg);
      padding:24px;
      max-width:400px; width:100%;
      border:1px solid var(--neon-soft);
    }
    .modal-head{
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:16px;
    }
    .modal-title{ font-size:14px; color:var(--neon); font-weight:500; }
    .modal-close{
      background:none; border:none;
      color:var(--text-dim); font-size:20px;
      cursor:pointer; line-height:1;
    }
    .modal-close:hover{ color:var(--text); }

    /* -----------------------------------------------------------
       PAGE-SPECIFIC: weekly tracker
       ----------------------------------------------------------- */
    body.page-weekly{ padding-bottom:90px; }

    body.page-weekly .header{ padding:20px 20px 0; margin-bottom:24px; }
    body.page-weekly .header h1{ font-family:var(--font-head); font-size:26px; font-weight:600; color:var(--text); margin-bottom:4px; }
    body.page-weekly .header p{ font-size:13px; color:var(--text-dim-2); }

    body.page-weekly .day-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:0 20px; margin-bottom:12px; }
    body.page-weekly .day-chip{
      padding:10px 4px; border-radius:11px; text-align:center; cursor:pointer;
      border:1px solid var(--border); background:rgba(255,255,255,.04);
      transition:all .15s; min-height:56px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    }
    body.page-weekly .day-chip.done{ background:var(--success-glow); border-color:var(--success-soft); }
    body.page-weekly .day-chip.today{ background:var(--neon-glow); border-color:var(--neon); }
    body.page-weekly .day-chip.selected{ box-shadow:0 0 0 2px var(--neon); }
    body.page-weekly .day-chip.future{ opacity:.3; cursor:default; }
    body.page-weekly .day-chip .chip-label{ font-size:9px; font-weight:600; letter-spacing:.04em; color:var(--text-dim-2); }
    body.page-weekly .day-chip.done .chip-label{ color:var(--success); }
    body.page-weekly .day-chip.today .chip-label{ color:var(--neon); }
    body.page-weekly .day-chip .chip-icon{ font-size:13px; line-height:1; }

    body.page-weekly .week-progress{ padding:0 20px; margin-bottom:24px; }
    body.page-weekly .progress-row{
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:6px; font-size:12px; color:var(--text-dim-2);
    }
    body.page-weekly .progress-row span:last-child{ color:var(--neon); font-weight:600; }
    body.page-weekly .track{ height:5px; border-radius:3px; background:var(--border); overflow:hidden; }
    body.page-weekly .fill{ height:5px; border-radius:3px; background:var(--success); transition:width .5s cubic-bezier(.22,1,.36,1); }

    body.page-weekly .entry-preview{
      margin:0 20px 20px; background:var(--panel); border-radius:16px; padding:20px;
      border:1px solid var(--neon-soft); display:none; animation:mh-slide-in .2s ease;
    }
    @keyframes mh-slide-in{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
    body.page-weekly .entry-preview-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    body.page-weekly .entry-day-name{ font-size:14px; font-weight:500; color:var(--neon); }
    body.page-weekly .entry-close{ background:none; border:none; color:var(--text-dim-2); font-size:18px; cursor:pointer; line-height:1; }
    body.page-weekly .entry-row{ padding:9px 0; border-bottom:1px solid var(--border); }
    body.page-weekly .entry-row:last-child{ border-bottom:none; }
    body.page-weekly .entry-row-cat{ font-size:10px; color:var(--success); letter-spacing:.06em; text-transform:uppercase; margin-bottom:3px; }
    body.page-weekly .entry-row-val{ font-size:13px; color:var(--text); line-height:1.5; }

    body.page-weekly .entry-card{
      background:var(--panel); border-radius:12px; padding:14px 16px; margin-bottom:8px;
      cursor:pointer; border:1px solid var(--border); transition:border-color .15s;
      display:flex; justify-content:space-between; align-items:center;
    }
    body.page-weekly .entry-card:hover{ border-color:var(--border-2); }
    body.page-weekly .entry-card-date{ font-size:13px; color:var(--neon); font-weight:500; margin-bottom:3px; }
    body.page-weekly .entry-card-snippet{ font-size:12px; color:var(--text-dim); line-height:1.4; max-width:260px; }
    body.page-weekly .entry-arrow{ color:var(--text-dim-2); font-size:14px; }

    body.page-weekly .empty-state{ text-align:center; padding:40px 20px; color:var(--text-dim-2); font-size:13px; line-height:1.6; }
  </style>
</head>
<body class="page-weekly" data-page="weekly">

<div class="header">
  <h1>This week</h1>
  <p id="week-subtitle">Loading…</p>
</div>

<!-- DAY CHIPS -->
<div class="day-grid" id="day-grid"></div>

<!-- PROGRESS BAR -->
<div class="week-progress">
  <div class="progress-row">
    <span id="prog-label">0 of 7 days complete</span>
    <span id="streak-label"></span>
  </div>
  <div class="track"><div class="fill" id="week-fill" style="width:0%"></div></div>
</div>

<!-- ENTRY PREVIEW -->
<div class="entry-preview" id="entry-preview">
  <div class="entry-preview-head">
    <div class="entry-day-name" id="preview-day-name">Monday</div>
    <button class="entry-close" onclick="closePreview()">✕</button>
  </div>
  <div id="preview-rows"></div>
</div>

<!-- ALL ENTRIES -->
<div class="section">
  <div class="section-head">All entries</div>
  <div id="entries-list"></div>
</div>

<nav class="bottom-nav">

</nav>

<script src="/templates/app.js"></script>
</body>
</html>
