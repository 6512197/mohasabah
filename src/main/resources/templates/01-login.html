<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محاسبة — Your Daily Journal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Dancing+Script:wght@600&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* =============================================================
       MOHASABA — UNIFIED STYLESHEET
       Single source of truth for every screen in the app.
       Visual language (palette, type, radii, shadows) is inherited
       from the login screen: near-black stage, off-white type, one
       neon-blue accent, plus a muted teal-green reserved only for
       "done / success" states.

       Structure of this file:
         1. Design tokens (:root)
         2. Global reset + base typography
         3. Shared components used by 2+ pages (buttons, inputs,
            bottom nav, toast, section headers …)
         4. Page-specific sections, each scoped under a unique
            body class (body.page-xxx) so identical class names on
            different pages never leak into one another.
       ============================================================= */

    /* ------------------------------------------------------------- */
    /* 1. DESIGN TOKENS                                               */
    /* ------------------------------------------------------------- */
    :root{
      --bg:        #07080b;
      --panel:     #101219;
      --panel-2:   #161924;
      --panel-3:   #1b1f2c;
      --border:    rgba(255,255,255,.09);
      --border-2:  rgba(255,255,255,.14);
      --text:      #f3f4f7;
      --text-dim:  #8c90a0;
      --text-dim-2:#5e6272;

      --neon:      #2fd8ff;
      --neon-2:    #5b7dff;
      --neon-soft: rgba(47,216,255,.35);
      --neon-glow: rgba(47,216,255,.18);

      /* secondary accent — used ONLY for "completed / success" states */
      --success:      #34e0b0;
      --success-soft: rgba(52,224,176,.35);
      --success-glow: rgba(52,224,176,.14);

      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;

      --font-ui:    'Inter', system-ui, sans-serif;
      --font-head:  'Poppins', var(--font-ui);
      --font-ar:    'Reem Kufi', var(--font-head);
      --font-script:'Dancing Script', cursive;
    }

    /* ------------------------------------------------------------- */
    /* 2. GLOBAL RESET + BASE TYPOGRAPHY                              */
    /* ------------------------------------------------------------- */
    *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
    html, body{ height:100%; }
    body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--font-ui);
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
    }

    /* ------------------------------------------------------------- */
    /* 3. SHARED COMPONENTS                                           */
    /* ------------------------------------------------------------- */

    /* ---- form fields (login, daily reflection, …) ---- */
    input[type=text],
    input[type=email],
    input[type=date],
    input[type=password],
    textarea{
      width:100%;
      background:var(--bg);
      border:1px solid var(--border);
      color:var(--text);
      font-family:var(--font-ui);
      font-size:14px;
      padding:12px 14px;
      border-radius:var(--radius-sm);
      outline:none;
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    textarea{ resize:vertical; min-height:90px; line-height:1.6; }
    input::placeholder, textarea::placeholder{ color:var(--text-dim-2); }
    input:focus, textarea:focus{
      border-color:var(--neon-soft);
      box-shadow:0 0 0 3px var(--neon-glow);
    }

    /* ---- primary / ghost buttons (used app‑wide) ---- */
    .btn-primary{
      display:block;
      width:100%;
      background:linear-gradient(135deg, var(--neon), var(--neon-2));
      color:#06070a;
      border:none;
      border-radius:var(--radius-sm);
      padding:13px 20px;
      font-family:var(--font-head);
      font-weight:600;
      font-size:14.5px;
      letter-spacing:.01em;
      cursor:pointer;
      text-align:center;
      text-decoration:none;
      box-shadow:0 10px 24px -8px var(--neon-soft);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -8px var(--neon-soft); }
    .btn-primary:active{ transform:scale(.98); }

    .btn-ghost{
      display:block;
      width:100%;
      background:transparent;
      color:var(--text-dim);
      border:1px solid var(--border-2);
      border-radius:var(--radius-sm);
      padding:12px 20px;
      font-family:var(--font-ui);
      font-size:13px;
      font-weight:500;
      cursor:pointer;
      text-align:center;
      transition:all .15s;
    }
    .btn-ghost:hover{ color:var(--text); border-color:var(--border-2); background:rgba(255,255,255,.03); }

    /* success‑tinted variant of the ghost button (e.g. "send report") */
    .btn-ghost.success{ color:var(--success); border-color:var(--success); }
    .btn-ghost.success:hover{ background:var(--success-glow); }

    /* ---- section headers (reports / week / home) ---- */
    .section{ padding:0 20px; margin-bottom:20px; }
    .section-head{
      font-size:10px;
      font-weight:600;
      color:var(--text-dim-2);
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    /* ---- bottom tab navigation (home / week / reports / daily) ---- */
    .bottom-nav{
      position:fixed; bottom:0; left:0; right:0;
      background:var(--panel-2);
      border-top:1px solid var(--border);
      display:flex; justify-content:space-around;
      padding:8px 0 14px;
      z-index:100;
    }
    .nav-item{
      display:flex; flex-direction:column; align-items:center;
      gap:2px;
      font-size:9px; font-weight:500;
      color:var(--text-dim-2);
      text-decoration:none;
      cursor:pointer;
      background:none; border:none;
      font-family:var(--font-ui);
      padding:4px 14px;
      transition:color .15s;
    }
    .nav-item.active{ color:var(--neon); }
    .nav-item .nav-icon{ font-size:20px; }

    /* ---- toast (base — page sections set the bottom offset) ---- */
    .toast{
      display:none;
      position:fixed; left:50%;
      transform:translateX(-50%);
      padding:10px 24px;
      border-radius:20px;
      font-size:13px;
      font-weight:600;
      white-space:nowrap;
      z-index:999;
      font-family:var(--font-ui);
      box-shadow:0 4px 20px rgba(0,0,0,.35);
    }
    .toast.neon{ background:var(--neon); color:#06070a; box-shadow:0 4px 20px rgba(0,0,0,.3), 0 0 20px var(--neon-soft); }
    .toast.success{ background:var(--success); color:#06070a; box-shadow:0 4px 20px rgba(0,0,0,.3), 0 0 20px var(--success-soft); }

    /* ---- lightweight modal (used by reports for past‑entry preview) ---- */
    .modal-overlay{
      position:fixed; inset:0;
      background:rgba(7,8,11,.92);
      display:flex; align-items:center; justify-content:center;
      z-index:9000; padding:20px; overflow-y:auto;
    }
    .modal-card{
      background:var(--panel-2);
      border-radius:var(--radius-lg);
      padding:24px;
      max-width:400px; width:100%;
      border:1px solid var(--neon-soft);
    }
    .modal-head{
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:16px;
    }
    .modal-title{ font-size:14px; color:var(--neon); font-weight:500; }
    .modal-close{
      background:none; border:none;
      color:var(--text-dim); font-size:20px;
      cursor:pointer; line-height:1;
    }
    .modal-close:hover{ color:var(--text); }

    /* -----------------------------------------------------------
       PAGE-SPECIFIC: login
       ----------------------------------------------------------- */
    body.page-login{ overflow-x:hidden; }

    body.page-login .scene{
      position:relative;
      min-height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    body.page-login .glow{
      position:absolute;
      border-radius:50%;
      filter:blur(90px);
      pointer-events:none;
      opacity:.5;
    }
    body.page-login .glow--a{
      width:520px; height:520px;
      top:-160px; left:-140px;
      background:radial-gradient(circle at 30% 30%, var(--neon-glow), transparent 70%);
    }
    body.page-login .glow--b{
      width:460px; height:460px;
      bottom:-180px; right:-120px;
      background:radial-gradient(circle at 70% 70%, rgba(91,125,255,.16), transparent 70%);
    }

    body.page-login .stage{
      position:relative;
      z-index:1;
      width:min(1080px, 92vw);
      display:grid;
      grid-template-columns:1fr 420px;
      align-items:center;
      gap:64px;
      padding:40px 0;
    }

    body.page-login .brand-panel{ display:flex; flex-direction:column; gap:96px; }
    body.page-login .brand-mark{ text-align:left; }
    body.page-login .brand-mark__ar{
      font-family:var(--font-ar);
      font-size:44px; font-weight:700; letter-spacing:.5px;
      margin:0; line-height:1;
      background:linear-gradient(180deg, #fff, #c9cdda);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    body.page-login .brand-mark__tag{
      font-family:var(--font-script);
      font-size:22px; color:var(--neon);
      margin:2px 0 0 4px;
      text-shadow:0 0 18px var(--neon-glow);
    }

    body.page-login .welcome__title{ font-family:var(--font-head); font-size:34px; font-weight:600; margin:0 0 6px; }
    body.page-login .welcome__sub{ font-family:var(--font-ui); font-size:16px; color:var(--text-dim); margin:0; }
    body.page-login .welcome__rule{
      display:block; margin-top:22px;
      width:64px; height:2px;
      background:linear-gradient(90deg, var(--neon), transparent);
      position:relative; border-radius:2px;
    }
    body.page-login .welcome__rule::after{
      content:''; position:absolute; top:-2px; left:0;
      width:6px; height:6px; border-radius:50%;
      background:var(--neon);
      box-shadow:0 0 10px 2px var(--neon-soft);
      animation:mh-pulse-run 3.2s ease-in-out infinite;
    }
    @keyframes mh-pulse-run{
      0%{ left:0; opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ left:58px; opacity:0; }
    }

    body.page-login .auth-card{
      position:relative;
      background:linear-gradient(180deg, var(--panel), var(--panel-2));
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:56px 32px 28px;
      box-shadow:0 30px 60px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02) inset;
    }

    body.page-login .avatar{
      position:absolute; top:-38px; left:50%; transform:translateX(-50%);
      width:76px; height:76px; border-radius:50%;
      background:var(--panel-3);
      border:1px solid var(--border-2);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 0 6px var(--bg), 0 0 24px var(--neon-glow);
    }
    body.page-login .avatar__icon{ width:38px; height:38px; fill:var(--text-dim); }
    body.page-login .avatar__status{
      position:absolute; bottom:2px; right:2px;
      width:14px; height:14px; border-radius:50%;
      background:var(--neon);
      border:2px solid var(--panel);
      box-shadow:0 0 8px 1px var(--neon-soft);
      animation:mh-breathe 2.4s ease-in-out infinite;
    }
    @keyframes mh-breathe{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.25); opacity:.7; } }

    body.page-login .tab-row{
      display:flex; background:var(--bg);
      border:1px solid var(--border);
      border-radius:999px; padding:4px; margin-bottom:26px;
      position:relative;
    }
    body.page-login .tab-btn{
      flex:1; padding:10px 12px; border:none; background:transparent;
      color:var(--text-dim);
      font-family:var(--font-head); font-size:13.5px; font-weight:600;
      border-radius:999px; cursor:pointer;
      transition:color .25s ease;
      position:relative; z-index:2;
    }
    body.page-login .tab-btn.active{ color:#08090c; }
    body.page-login .tab-btn::before{
      content:''; position:absolute; top:0; left:0; width:100%; height:100%;
      border-radius:999px;
      background:linear-gradient(135deg, var(--neon), var(--neon-2));
      box-shadow:0 0 18px var(--neon-soft);
      opacity:0; transition:opacity .32s cubic-bezier(.65,0,.35,1);
      z-index:-1;
    }
    body.page-login .tab-btn.active::before{ opacity:1; }
    body.page-login .tab-btn:not(.active):hover{ color:var(--text); }

    body.page-login #login-panel,
    body.page-login #register-panel{ animation:mh-panel-in .32s ease both; }
    @keyframes mh-panel-in{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

    body.page-login .field-group{ display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
    body.page-login .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
    body.page-login .field-row > div{ display:flex; flex-direction:column; gap:7px; }
    body.page-login .field-group label,
    body.page-login .field-row label{
      font-size:11px; letter-spacing:.08em; text-transform:uppercase;
      color:var(--text-dim-2); font-weight:600;
    }

    body.page-login .pw-wrap{ position:relative; display:flex; }
    body.page-login .pw-wrap input{ padding-right:42px; }
    body.page-login .pw-toggle{
      position:absolute; right:6px; top:50%; transform:translateY(-50%);
      width:30px; height:30px;
      display:flex; align-items:center; justify-content:center;
      background:transparent; border:none; cursor:pointer;
      color:var(--text-dim); font-size:16px;
    }
    body.page-login .pw-toggle:hover{ color:var(--text); }

    body.page-login .btn-primary{ margin-top:4px; }

    body.page-login .switch-link{ text-align:center; font-size:12.5px; color:var(--text-dim); margin:18px 0 0; }
    body.page-login .switch-link a{ color:var(--neon); font-weight:600; text-decoration:none; }
    body.page-login .switch-link a:hover{ text-decoration:underline; }

    body.page-login .error-msg{
      display:none; min-height:32px; text-align:center; font-size:13px;
      color:#ff6b6b; padding:8px 12px; margin-bottom:16px;
      background:rgba(255,107,107,.08);
      border-radius:var(--radius-sm);
      border:1px solid rgba(255,107,107,.2);
    }
    body.page-login .error-msg:not(:empty){ display:block; }

    @media (max-width:880px){
      body.page-login .stage{ grid-template-columns:1fr; justify-items:center; text-align:center; gap:48px; }
      body.page-login .brand-panel{ align-items:center; gap:48px; }
      body.page-login .brand-mark{ text-align:center; }
      body.page-login .welcome__rule{ margin-inline:auto; }
      body.page-login .auth-card{ width:min(420px, 90vw); }
      body.page-login .field-row{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body class="page-login" data-page="login">

<div class="scene">

  <!-- ambient glow blobs -->
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>

  <div class="stage">

    <!-- LEFT: brand + welcome -->
    <section class="brand-panel">
      <div class="brand-mark">
        <h1 class="brand-mark__ar">محاسبة</h1>
        <p class="brand-mark__tag">Your daily journal</p>
      </div>

      <div class="welcome">
        <h2 class="welcome__title">Welcome</h2>
        <p class="welcome__sub" id="welcomeSub">how are you today?</p>
        <span class="welcome__rule" aria-hidden="true"></span>
      </div>
    </section>

    <!-- RIGHT: auth card -->
    <section class="auth-card" aria-live="polite">

      <div class="avatar">
        <svg viewBox="0 0 24 24" class="avatar__icon" aria-hidden="true">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12Zm0 2.5c-3.5 0-10.4 1.7-10.4 5.2v1.1c0 .7.6 1.3 1.3 1.3h18.2c.7 0 1.3-.6 1.3-1.3v-1.1c0-3.5-6.9-5.2-10.4-5.2Z"/>
        </svg>
        <span class="avatar__status" title="Active today"></span>
      </div>

      <!-- Tabs -->
      <div class="card">

        <div class="tab-row">
          <button class="tab-btn active" id="tab-login" onclick="switchMode('login')">Sign in</button>
          <button class="tab-btn" id="tab-register" onclick="switchMode('register')">Create account</button>
        </div>

        <div id="error-box" class="error-msg"></div>

        <!-- LOGIN PANEL -->
        <div id="login-panel">
          <div class="field-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="field-group">
            <label for="login-pw">Password</label>
            <div class="pw-wrap">
              <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password">
              <button class="pw-toggle" onclick="togglePw('login-pw', this)" aria-label="Show password">👁</button>
            </div>
          </div>

          <button class="btn-primary" onclick="handleLogin()">Sign in</button>
        </div>

        <!-- REGISTER PANEL -->
        <div id="register-panel" style="display:none">
          <div class="field-row">
            <div>
              <label for="reg-first">First name</label>
              <input type="text" id="reg-first" placeholder="Ahmad" autocomplete="given-name">
            </div>
            <div>
              <label for="reg-last">Last name</label>
              <input type="text" id="reg-last" placeholder="Al-Rashid" autocomplete="family-name">
            </div>
          </div>

          <div class="field-group">
            <label for="reg-dob">Date of birth</label>
            <input type="date" id="reg-dob">
          </div>

          <div class="field-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="field-group">
            <label for="reg-email2">Confirm email</label>
            <input type="email" id="reg-email2" placeholder="Repeat your email">
          </div>

          <div class="field-group">
            <label for="reg-pw">Password</label>
            <div class="pw-wrap">
              <input type="password" id="reg-pw" placeholder="Min. 6 characters" autocomplete="new-password">
              <button class="pw-toggle" onclick="togglePw('reg-pw', this)" aria-label="Show password">👁</button>
            </div>
          </div>

          <div class="field-group">
            <label for="reg-pw2">Confirm password</label>
            <div class="pw-wrap">
              <input type="password" id="reg-pw2" placeholder="Repeat your password">
              <button class="pw-toggle" onclick="togglePw('reg-pw2', this)" aria-label="Show password">👁</button>
            </div>
          </div>

          <button class="btn-primary" onclick="handleRegister()" style="margin-top:8px">Create account</button>
        </div>

        <div class="switch-link" id="switch-link">
          New here? <a href="#" onclick="switchMode('register'); return false;">Create a free account</a>
        </div>

      </div>

    </section>
  </div>
</div>
<script src="/templates/app.js"></script>

</body>
</html>
