<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محاسبة — Your Daily Journal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Dancing+Script:wght@600&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       Muhasaba — auth screen
       Palette: near-black stage, white type, one neon-blue accent
       ========================================================= */

    :root{
      --bg:        #07080b;
      --panel:     #101219;
      --panel-2:   #161924;
      --panel-3:   #1b1f2c;
      --border:    rgba(255,255,255,.09);
      --border-2:  rgba(255,255,255,.14);
      --text:      #f3f4f7;
      --text-dim:  #8c90a0;
      --text-dim-2:#5e6272;

      --neon:      #2fd8ff;
      --neon-2:    #5b7dff;
      --neon-soft: rgba(47,216,255,.35);
      --neon-glow: rgba(47,216,255,.18);

      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;

      --font-ui:   'Inter', system-ui, sans-serif;
      --font-head: 'Poppins', var(--font-ui);
      --font-ar:   'Reem Kufi', var(--font-head);
      --font-script:'Dancing Script', cursive;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--font-ui);
      -webkit-font-smoothing:antialiased;
    }

    /* ---------- scene / ambient glow ---------- */
    .scene{
      position:relative;
      min-height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .glow{
      position:absolute;
      border-radius:50%;
      filter:blur(90px);
      pointer-events:none;
      opacity:.5;
    }
    .glow--a{
      width:520px; height:520px;
      top:-160px; left:-140px;
      background:radial-gradient(circle at 30% 30%, var(--neon-glow), transparent 70%);
    }
    .glow--b{
      width:460px; height:460px;
      bottom:-180px; right:-120px;
      background:radial-gradient(circle at 70% 70%, rgba(91,125,255,.16), transparent 70%);
    }

    /* ---------- stage: two-column layout ---------- */
    .stage{
      position:relative;
      z-index:1;
      width:min(1080px, 92vw);
      display:grid;
      grid-template-columns:1fr 420px;
      align-items:center;
      gap:64px;
      padding:40px 0;
    }

    /* ---------- brand / welcome (left) ---------- */
    .brand-panel{
      display:flex;
      flex-direction:column;
      gap:96px;
    }

    .brand-mark{ text-align:left; }
    .brand-mark__ar{
      font-family:var(--font-ar);
      font-size:44px;
      font-weight:700;
      letter-spacing:.5px;
      margin:0;
      line-height:1;
      background:linear-gradient(180deg, #fff, #c9cdda);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .brand-mark__img{ max-height:64px; }
    .brand-mark__tag{
      font-family:var(--font-script);
      font-size:22px;
      color:var(--neon);
      margin:2px 0 0 4px;
      text-shadow:0 0 18px var(--neon-glow);
    }

    .welcome__title{
      font-family:var(--font-head);
      font-size:34px;
      font-weight:600;
      margin:0 0 6px;
    }
    .welcome__sub{
      font-family:var(--font-ui);
      font-size:16px;
      color:var(--text-dim);
      margin:0;
    }
    .welcome__rule{
      display:block;
      margin-top:22px;
      width:64px;
      height:2px;
      background:linear-gradient(90deg, var(--neon), transparent);
      position:relative;
      border-radius:2px;
    }
    .welcome__rule::after{
      content:'';
      position:absolute;
      top:-2px; left:0;
      width:6px; height:6px;
      border-radius:50%;
      background:var(--neon);
      box-shadow:0 0 10px 2px var(--neon-soft);
      animation:pulse-run 3.2s ease-in-out infinite;
    }
    @keyframes pulse-run{
      0%   { left:0;   opacity:0; }
      10%  { opacity:1; }
      90%  { opacity:1; }
      100% { left:58px; opacity:0; }
    }

    /* ---------- auth card (right) ---------- */
    .auth-card{
      position:relative;
      background:linear-gradient(180deg, var(--panel), var(--panel-2));
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:56px 32px 28px;
      box-shadow:
              0 30px 60px -20px rgba(0,0,0,.6),
              0 0 0 1px rgba(255,255,255,.02) inset;
    }

    .avatar{
      position:absolute;
      top:-38px; left:50%;
      transform:translateX(-50%);
      width:76px; height:76px;
      border-radius:50%;
      background:var(--panel-3);
      border:1px solid var(--border-2);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 0 6px var(--bg), 0 0 24px var(--neon-glow);
    }
    .avatar__icon{
      width:38px; height:38px;
      fill:var(--text-dim);
    }
    .avatar__status{
      position:absolute;
      bottom:2px; right:2px;
      width:14px; height:14px;
      border-radius:50%;
      background:var(--neon);
      border:2px solid var(--panel);
      box-shadow:0 0 8px 1px var(--neon-soft);
      animation:breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe{
      0%,100%{ transform:scale(1);   opacity:1; }
      50%    { transform:scale(1.25); opacity:.7; }
    }

    /* ---------- tabs ---------- */
    .card{
      position:relative;
    }

    .tab-row{
      display:flex;
      background:var(--bg);
      border:1px solid var(--border);
      border-radius:999px;
      padding:4px;
      margin-bottom:26px;
      position:relative;
    }

    .tab-btn{
      flex:1;
      padding:10px 12px;
      border:none;
      background:transparent;
      color:var(--text-dim);
      font-family:var(--font-head);
      font-size:13.5px;
      font-weight:600;
      border-radius:999px;
      cursor:pointer;
      transition:color .25s ease;
      position:relative;
      z-index:2;
    }

    .tab-btn.active{
      color:#08090c;
    }

    .tab-btn::before{
      content:'';
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      border-radius:999px;
      background:linear-gradient(135deg, var(--neon), var(--neon-2));
      box-shadow:0 0 18px var(--neon-soft);
      opacity:0;
      transition:opacity .32s cubic-bezier(.65,0,.35,1);
      z-index:-1;
    }

    .tab-btn.active::before{
      opacity:1;
    }

    .tab-btn:not(.active){
      color:var(--text-dim);
    }

    .tab-btn:not(.active):hover{
      color:var(--text);
    }

    /* ---------- panels ---------- */
    #login-panel,
    #register-panel{
      animation:panel-in .32s ease both;
    }

    @keyframes panel-in{
      from{ opacity:0; transform:translateY(6px); }
      to  { opacity:1; transform:translateY(0); }
    }

    .field-group{
      display:flex;
      flex-direction:column;
      gap:7px;
      margin-bottom:16px;
    }

    .field-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:16px;
    }

    .field-row > div{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .field-group label,
    .field-row label{
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--text-dim-2);
      font-weight:600;
    }

    .field-group input,
    .field-row input{
      width:100%;
      background:var(--bg);
      border:1px solid var(--border);
      color:var(--text);
      font-family:var(--font-ui);
      font-size:14px;
      padding:12px 14px;
      border-radius:var(--radius-sm);
      outline:none;
      transition:border-color .2s ease, box-shadow .2s ease;
    }

    .field-group input::placeholder,
    .field-row input::placeholder{
      color:var(--text-dim-2);
    }

    .field-group input:focus,
    .field-row input:focus{
      border-color:var(--neon-soft);
      box-shadow:0 0 0 3px var(--neon-glow);
    }

    .pw-wrap{
      position:relative;
      display:flex;
    }

    .pw-wrap input{
      padding-right:42px;
    }

    .pw-toggle{
      position:absolute;
      right:6px; top:50%;
      transform:translateY(-50%);
      width:30px; height:30px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      border:none;
      cursor:pointer;
      color:var(--text-dim);
      font-size:16px;
    }

    .pw-toggle:hover{
      color:var(--text);
    }

    .btn-primary{
      width:100%;
      margin-top:4px;
      padding:13px;
      border:none;
      border-radius:var(--radius-sm);
      background:linear-gradient(135deg, var(--neon), var(--neon-2));
      color:#06070a;
      font-family:var(--font-head);
      font-weight:600;
      font-size:14.5px;
      letter-spacing:.01em;
      cursor:pointer;
      box-shadow:0 10px 24px -8px var(--neon-soft);
      transition:transform .15s ease, box-shadow .15s ease;
    }

    .btn-primary:hover{
      transform:translateY(-1px);
      box-shadow:0 14px 28px -8px var(--neon-soft);
    }

    .btn-primary:active{
      transform:translateY(0);
    }

    .switch-link{
      text-align:center;
      font-size:12.5px;
      color:var(--text-dim);
      margin:18px 0 0;
    }

    .switch-link a{
      color:var(--neon);
      font-weight:600;
      text-decoration:none;
    }

    .switch-link a:hover{
      text-decoration:underline;
    }

    .error-msg{
      display:none;
      min-height:32px;
      text-align:center;
      font-size:13px;
      color:#ff6b6b;
      padding:8px 12px;
      margin-bottom:16px;
      background:rgba(255,107,107,.08);
      border-radius:var(--radius-sm);
      border:1px solid rgba(255,107,107,.2);
    }

    .error-msg:not(:empty){
      display:block;
    }

    /* ---------- responsive ---------- */
    @media (max-width: 880px){
      .stage{
        grid-template-columns:1fr;
        justify-items:center;
        text-align:center;
        gap:48px;
      }
      .brand-panel{
        align-items:center;
        gap:48px;
      }
      .brand-mark{
        text-align:center;
      }
      .welcome__rule{
        margin-inline:auto;
      }
      .auth-card{
        width:min(420px, 90vw);
      }
      .field-row{
        grid-template-columns:1fr;
      }
    }

    @media (prefers-reduced-motion: reduce){
      *{
        animation-duration:.001ms !important;
        transition-duration:.001ms !important;
      }
    }
  </style>
</head>
<body>

<div class="scene">

  <!-- ambient glow blobs -->
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>

  <div class="stage">

    <!-- LEFT: brand + welcome -->
    <section class="brand-panel">
      <div class="brand-mark">
        <h1 class="brand-mark__ar">محاسبة</h1>
        <p class="brand-mark__tag">Your daily journal</p>
      </div>

      <div class="welcome">
        <h2 class="welcome__title">Welcome</h2>
        <p class="welcome__sub" id="welcomeSub">how are you today?</p>
        <span class="welcome__rule" aria-hidden="true"></span>
      </div>
    </section>

    <!-- RIGHT: auth card -->
    <section class="auth-card" aria-live="polite">

      <div class="avatar">
        <svg viewBox="0 0 24 24" class="avatar__icon" aria-hidden="true">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12Zm0 2.5c-3.5 0-10.4 1.7-10.4 5.2v1.1c0 .7.6 1.3 1.3 1.3h18.2c.7 0 1.3-.6 1.3-1.3v-1.1c0-3.5-6.9-5.2-10.4-5.2Z"/>
        </svg>
        <span class="avatar__status" title="Active today"></span>
      </div>

      <!-- Tabs -->
      <div class="card">

        <div class="tab-row">
          <button class="tab-btn active" id="tab-login" onclick="switchMode('login')">Sign in</button>
          <button class="tab-btn" id="tab-register" onclick="switchMode('register')">Create account</button>
        </div>

        <div id="error-box" class="error-msg"></div>

        <!-- LOGIN PANEL -->
        <div id="login-panel">
          <div class="field-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="field-group">
            <label for="login-pw">Password</label>
            <div class="pw-wrap">
              <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password">
              <button class="pw-toggle" onclick="togglePw('login-pw', this)" aria-label="Show password">👁</button>
            </div>
          </div>

          <button class="btn-primary" onclick="handleLogin()">Sign in</button>
        </div>

        <!-- REGISTER PANEL -->
        <div id="register-panel" style="display:none">
          <div class="field-row">
            <div>
              <label for="reg-first">First name</label>
              <input type="text" id="reg-first" placeholder="Ahmad" autocomplete="given-name">
            </div>
            <div>
              <label for="reg-last">Last name</label>
              <input type="text" id="reg-last" placeholder="Al-Rashid" autocomplete="family-name">
            </div>
          </div>

          <div class="field-group">
            <label for="reg-dob">Date of birth</label>
            <input type="date" id="reg-dob">
          </div>

          <div class="field-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="field-group">
            <label for="reg-email2">Confirm email</label>
            <input type="email" id="reg-email2" placeholder="Repeat your email">
          </div>

          <div class="field-group">
            <label for="reg-pw">Password</label>
            <div class="pw-wrap">
              <input type="password" id="reg-pw" placeholder="Min. 6 characters" autocomplete="new-password">
              <button class="pw-toggle" onclick="togglePw('reg-pw', this)" aria-label="Show password">👁</button>
            </div>
          </div>

          <div class="field-group">
            <label for="reg-pw2">Confirm password</label>
            <div class="pw-wrap">
              <input type="password" id="reg-pw2" placeholder="Repeat your password">
              <button class="pw-toggle" onclick="togglePw('reg-pw2', this)" aria-label="Show password">👁</button>
            </div>
          </div>

          <button class="btn-primary" onclick="handleRegister()" style="margin-top:8px">Create account</button>
        </div>

        <div class="switch-link" id="switch-link">
          New here? <a href="#" onclick="switchMode('register'); return false;">Create a free account</a>
        </div>

      </div>

    </section>
  </div>
</div>

<script>
  const welcomeSub = document.getElementById('welcomeSub');
  const copy = {
    login: 'how are you today?',
    register: "let's set your journal up",
  };

  function switchMode(mode) {
    const isLogin = mode === 'login';

    // Show/hide panels
    document.getElementById('login-panel').style.display = isLogin ? 'block' : 'none';
    document.getElementById('register-panel').style.display = isLogin ? 'none' : 'block';

    // Update tab buttons
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-register').classList.toggle('active', !isLogin);

    // Update welcome message
    welcomeSub.textContent = copy[mode];

    // Update switch link
    document.getElementById('switch-link').innerHTML = isLogin
            ? 'New here? <a href="#" onclick="switchMode(\'register\'); return false;">Create a free account</a>'
            : 'Already have an account? <a href="#" onclick="switchMode(\'login\'); return false;">Sign in</a>';

    // Clear error messages
    showError('');
  }

  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    if (!inp) return;
    const hidden = inp.type === 'password';
    inp.type = hidden ? 'text' : 'password';
    btn.textContent = hidden ? '🙈' : '👁';
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pw = document.getElementById('login-pw').value;

    if (!email || !pw) {
      showError('Enter your email and password.');
      return;
    }

    const users = JSON.parse(localStorage.getItem('moh_users') || '[]');
    const found = users.find(u => u.email === email && u.password === pw);

    if (!found) {
      showError('Email or password is incorrect.');
      return;
    }

    localStorage.setItem('moh_user', JSON.stringify(found));
    window.location.href = '03-home.html';
  }

  function handleRegister() {
    const first = document.getElementById('reg-first').value.trim();
    const last = document.getElementById('reg-last').value.trim();
    const dob = document.getElementById('reg-dob').value;
    const email = document.getElementById('reg-email').value.trim();
    const email2 = document.getElementById('reg-email2').value.trim();
    const pw = document.getElementById('reg-pw').value;
    const pw2 = document.getElementById('reg-pw2').value;

    if (!first || !last || !dob || !email || !pw) {
      showError('All fields are required.');
      return;
    }

    if (email !== email2) {
      showError("Emails don't match.");
      return;
    }

    if (pw !== pw2) {
      showError("Passwords don't match.");
      return;
    }

    if (pw.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }

    const users = JSON.parse(localStorage.getItem('moh_users') || '[]');

    if (users.find(u => u.email === email)) {
      showError('An account with this email already exists.');
      return;
    }

    const newUser = {
      firstName: first,
      lastName: last,
      dob: dob,
      email: email,
      password: pw,
      id: Date.now()
    };

    users.push(newUser);
    localStorage.setItem('moh_users', JSON.stringify(users));
    localStorage.setItem('moh_user', JSON.stringify(newUser));
    window.location.href = '03-home.html';
  }

  // Redirect if already logged in
  if (localStorage.getItem('moh_user')) {
    window.location.href = '03-home.html';
  }
</script>

</body>
</html>
