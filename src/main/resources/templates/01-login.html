<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محاسبة — Your Daily Journal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Dancing+Script:wght@600&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/templates/app.css">
</head>
<body class="page-login" data-page="login">

<div class="scene">

  <!-- ambient glow blobs -->
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>

  <div class="stage">

    <!-- LEFT: brand + welcome -->
    <section class="brand-panel">
      <div class="brand-mark">
        <h1 class="brand-mark__ar">محاسبة</h1>
        <p class="brand-mark__tag">Your daily journal</p>
      </div>

      <div class="welcome">
        <h2 class="welcome__title">Welcome</h2>
        <p class="welcome__sub" id="welcomeSub">how are you today?</p>
        <span class="welcome__rule" aria-hidden="true"></span>
      </div>
    </section>

    <!-- RIGHT: auth card -->
    <section class="auth-card" aria-live="polite">

      <div class="avatar">
        <svg viewBox="0 0 24 24" class="avatar__icon" aria-hidden="true">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12Zm0 2.5c-3.5 0-10.4 1.7-10.4 5.2v1.1c0 .7.6 1.3 1.3 1.3h18.2c.7 0 1.3-.6 1.3-1.3v-1.1c0-3.5-6.9-5.2-10.4-5.2Z"/>
        </svg>
        <span class="avatar__status" title="Active today"></span>
      </div>

      <!-- Tabs -->
      <div class="card">

        <div class="tab-row">
          <button class="tab-btn active" id="tab-login" onclick="switchMode('login')">Sign in</button>
          <button class="tab-btn" id="tab-register" onclick="switchMode('register')">Create account</button>
        </div>

        <div id="error-box" class="error-msg"></div>

        <!-- LOGIN PANEL -->
        <div id="login-panel">
          <div class="field-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="field-group">
            <label for="login-pw">Password</label>
            <div class="pw-wrap">
              <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password">
              <button class="pw-toggle" onclick="togglePw('login-pw', this)" aria-label="Show password">👁</button>
            </div>
          </div>

          <button class="btn-primary" onclick="handleLogin()">Sign in</button>
        </div>

        <!-- REGISTER PANEL -->
        <div id="register-panel" style="display:none">
          <div class="field-row">
            <div>
              <label for="reg-first">First name</label>
              <input type="text" id="reg-first" placeholder="Ahmad" autocomplete="given-name">
            </div>
            <div>
              <label for="reg-last">Last name</label>
              <input type="text" id="reg-last" placeholder="Al-Rashid" autocomplete="family-name">
            </div>
          </div>

          <div class="field-group">
            <label for="reg-dob">Date of birth</label>
            <input type="date" id="reg-dob">
          </div>

          <div class="field-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="field-group">
            <label for="reg-email2">Confirm email</label>
            <input type="email" id="reg-email2" placeholder="Repeat your email">
          </div>

          <div class="field-group">
            <label for="reg-pw">Password</label>
            <div class="pw-wrap">
              <input type="password" id="reg-pw" placeholder="Min. 6 characters" autocomplete="new-password">
              <button class="pw-toggle" onclick="togglePw('reg-pw', this)" aria-label="Show password">👁</button>
            </div>
          </div>

          <div class="field-group">
            <label for="reg-pw2">Confirm password</label>
            <div class="pw-wrap">
              <input type="password" id="reg-pw2" placeholder="Repeat your password">
              <button class="pw-toggle" onclick="togglePw('reg-pw2', this)" aria-label="Show password">👁</button>
            </div>
          </div>

          <button class="btn-primary" onclick="handleRegister()" style="margin-top:8px">Create account</button>
        </div>

        <div class="switch-link" id="switch-link">
          New here? <a href="#" onclick="switchMode('register'); return false;">Create a free account</a>
        </div>

      </div>

    </section>
  </div>
</div>
<script src="/templates/app.js"></script>

</body>
</html>
